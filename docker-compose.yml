services:
  postgres:
    image: postgres:15
    container_name: expense_postgres
    environment:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - expense_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: expense_pg_admin
    restart: unless-stopped
    environment:
      - .env.dev
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - expense_network

volumes:
  postgres_data:

networks:
  expense_network:
    driver: bridge